name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - name: Check native libraries in the APK
        run: |
          apk=app/build/outputs/apk/debug/app-universal-debug.apk
          unzip -l "$apk" | grep '\.so$'
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            for lib in libbyedpi.so libhev-socks5-tunnel.so; do
              unzip -l "$apk" | grep -q "lib/$abi/$lib" || { echo "missing lib/$abi/$lib"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v5
        with:
          name: zapretdroid-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
