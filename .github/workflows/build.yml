name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (e.g. 0.1.0); leave empty to only build"
        required: false
        default: ""
      stable:
        description: "Stable release: a release build (io.github.zapretdroid), not a pre-release"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Native engine tests
        shell: bash
        run: |
          set -o pipefail
          # On failure, the end of the output also goes out as an annotation: readable through
          # the API (check-runs/<job>/annotations) where the log itself is not.
          if ! app/src/test/native/run.sh 2>&1 | tee native-tests.log; then
            tail -n 60 native-tests.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' > tail.txt
            echo "::error title=Native engine tests::$(cat tail.txt)"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest :core:test

      - name: Build debug APKs
        if: ${{ !inputs.stable }}
        run: ./gradlew --no-daemon assembleDebug

      # Stable releases: numbered on their own (0.0.1 on); versionCode = major*10000+minor*100+patch.
      - name: Build release APKs
        if: ${{ inputs.stable }}
        env:
          INPUT_VERSION: ${{ inputs.release }}
        run: |
          version="${INPUT_VERSION#v}"
          case "$version" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "stable needs a version like 0.0.1"; exit 1 ;; esac
          IFS=. read -r major minor patch <<< "$version"
          ./gradlew --no-daemon assembleRelease -PappVersionName="$version" -PappVersionCode=$((major * 10000 + minor * 100 + patch))

      - name: Check native libraries in the APK
        run: |
          apk=$(ls app/build/outputs/apk/*/app-universal-*.apk | head -1)
          unzip -l "$apk" | grep '\.so$'
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            for lib in libbyedpi.so libhev-socks5-tunnel.so; do
              unzip -l "$apk" | grep -q "lib/$abi/$lib" || { echo "missing lib/$abi/$lib"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v5
        with:
          name: zapretdroid-${{ inputs.stable && 'release' || 'debug' }}
          path: |
            app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.release }}
          STABLE: ${{ inputs.stable }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then version="${INPUT_VERSION#v}"; else version="${GITHUB_REF_NAME#v}"; fi
          tag="v$version"
          mkdir -p release
          if [ "$STABLE" = true ]; then
            for apk in app/build/outputs/apk/release/*.apk; do
              abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
              cp "$apk" "release/byezapret-$version-$abi.apk"
            done
            kind=stable
            flag=--latest
          else
            for apk in app/build/outputs/apk/debug/*.apk; do
              abi=$(basename "$apk" | sed -E 's/^app-(.*)-debug\.apk$/\1/')
              cp "$apk" "release/zapretdroid-$version-$abi.apk"
            done
            kind=test
            flag=--prerelease
          fi
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          sh .github/notes.sh "$version" "$kind" > release-notes.md
          # Creates the tag at the built commit if it does not exist yet.
          gh release create "$tag" release/* \
            $flag \
            --target "$GITHUB_SHA" \
            --title "ByeZapret $version" \
            --notes-file release-notes.md

  # The Linux desktop app (Compose): built without the Android SDK, uploaded as a tar.gz.
  desktop:
    if: ${{ !inputs.stable }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Core tests and desktop app
        run: ./gradlew --no-daemon -PnoAndroid :core:test :desktop:createDistributable

      - name: Pack
        run: |
          dist=desktop/build/compose/binaries/main/app
          ls -R "$dist" | head -40
          tar -czf byezapret-desktop-linux-x64.tar.gz -C "$dist" .

      - uses: actions/upload-artifact@v5
        with:
          name: byezapret-desktop-linux-x64
          path: byezapret-desktop-linux-x64.tar.gz
          if-no-files-found: error

  # Keeps the descriptions of published releases in step with CHANGELOG.md.
  release-notes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/zapret-android-no-root-632xp0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Update release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in $(grep -E '^## [0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | cut -c4-); do
            if pre=$(gh release view "v$v" --json isPrerelease -q .isPrerelease 2>/dev/null); then
              if [ "$pre" = true ]; then kind=test; else kind=stable; fi
              sh .github/notes.sh "$v" "$kind" > notes.md
              gh release edit "v$v" --notes-file notes.md && echo "v$v updated"
            fi
          done
