name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a pre-release with this version (e.g. 0.1.0); leave empty to only build"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Native engine tests
        run: app/src/test/native/run.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - name: Check native libraries in the APK
        run: |
          apk=app/build/outputs/apk/debug/app-universal-debug.apk
          unzip -l "$apk" | grep '\.so$'
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            for lib in libbyedpi.so libhev-socks5-tunnel.so; do
              unzip -l "$apk" | grep -q "lib/$abi/$lib" || { echo "missing lib/$abi/$lib"; exit 1; }
            done
            tapk=tor/build/outputs/apk/debug/tor-$abi-debug.apk
            for lib in libtor.so libgojni.so; do
              unzip -l "$tapk" | grep -q "lib/$abi/$lib" || { echo "missing lib/$abi/$lib in the Tor module"; exit 1; }
            done
          done
          ls -la tor/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v5
        with:
          name: zapretdroid-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            tor/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.release }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then version="${INPUT_VERSION#v}"; else version="${GITHUB_REF_NAME#v}"; fi
          tag="v$version"
          mkdir -p release
          for apk in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-debug\.apk$/\1/')
            cp "$apk" "release/zapretdroid-$version-$abi.apk"
          done
          # The Tor module (separate APK per ABI): byezapret-tor-<module version>-<abi>.apk.
          torver=$(jq -r '.elements[0].versionName' tor/build/outputs/apk/debug/output-metadata.json)
          torver="${torver%-debug}"
          for apk in tor/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$apk" | sed -E 's/^tor-(.*)-debug\.apk$/\1/')
            cp "$apk" "release/byezapret-tor-$torver-$abi.apk"
          done
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          sh .github/notes.sh "$version" > release-notes.md
          # Creates the tag at the built commit if it does not exist yet.
          gh release create "$tag" release/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "ByeZapret $version" \
            --notes-file release-notes.md

  # Keeps the descriptions of published releases in step with CHANGELOG.md.
  release-notes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/zapret-android-no-root-632xp0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Update release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in $(grep -E '^## [0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | cut -c4-); do
            if gh release view "v$v" > /dev/null 2>&1; then
              sh .github/notes.sh "$v" > notes.md
              gh release edit "v$v" --notes-file notes.md && echo "v$v updated"
            fi
          done
